
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sentence Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nanum+Gothic', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        /* Custom animation for the background elements */
        @keyframes scrollBackground {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
        .animate-scroll {
            animation: scrollBackground linear infinite;
        }
        @keyframes characterBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-character {
            animation: characterBounce 0.4s ease-in-out infinite;
        }
        .perspective-container {
            perspective: 1000px;
        }
        .road-tilt {
            transform: rotateX(45deg);
        }
    </style>
