
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sentence Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nanum+Gothic', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        /* 배경 요소들이 왼쪽에서 오른쪽으로 흐르도록 애니메이션 수정 (캐릭터가 왼쪽으로 달리는 효과) */
        @keyframes scrollBackground {
            from { transform: translateX(-100%); }
            to { transform: translateX(100vw); }
        }
        .animate-scroll {
            animation: scrollBackground linear infinite;
        }
        @keyframes characterBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-character {
            animation: characterBounce 0.4s ease-in-out infinite;
        }
        .perspective-container {
            perspective: 1000px;
        }
        .road-tilt {
            transform: rotateX(45deg);
        }
    </style>
<script type="importmap">

</head>
